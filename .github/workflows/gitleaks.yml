name: Gitleaks scan

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  schedule:
    - cron: '0 3 * * 1'  # Weekly full history scan Monday 03:00 UTC

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history for weekly cron scan; shallow для PR/push
          # (PR-diff mode limits scope к new commits — per Iskra R-K5 Q4 canon
          #  «weekly full history + PR-diff on every PR»)
          fetch-depth: ${{ github.event_name == 'schedule' && 0 || 50 }}

      - name: Install gitleaks (binary, version-pinned)
        run: |
          GITLEAKS_VERSION="8.28.0"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks scan (weekly full history)
        if: github.event_name == 'schedule'
        run: gitleaks detect --config=.gitleaks.toml --verbose --redact --no-git=false

      - name: Run gitleaks scan (PR-diff / push new commits)
        if: github.event_name != 'schedule'
        run: |
          # Scan only new commits: PR-diff for pull_request, HEAD~1..HEAD for push
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            LOG_OPTS="origin/${{ github.base_ref }}..HEAD"
          else
            LOG_OPTS="HEAD~1..HEAD"
          fi
          echo "Scanning с log-opts: $LOG_OPTS"
          gitleaks detect --config=.gitleaks.toml --verbose --redact --log-opts="$LOG_OPTS"
